apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: monitoring
data:
  alerts.yml: |
    groups:
    - name: gpu_alerts
      interval: 30s
      rules:
      - alert: GPUHighTemperature
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 5m
        labels:
          severity: critical
          component: gpu
        annotations:
          summary: "GPU temperature is critically high"
          description: "GPU {{ $labels.gpu }} on node {{ $labels.kubernetes_node }} has temperature {{ $value }}°C (threshold: 85°C)"
      
      - alert: GPUHighUtilization
        expr: DCGM_FI_DEV_GPU_UTIL > 95
        for: 10m
        labels:
          severity: warning
          component: gpu
        annotations:
          summary: "GPU utilization is very high"
          description: "GPU {{ $labels.gpu }} on node {{ $labels.kubernetes_node }} has utilization {{ $value }}% for more than 10 minutes"
      
      - alert: GPUMemoryPressure
        expr: (DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_FREE) > 0.9
        for: 5m
        labels:
          severity: warning
          component: gpu
        annotations:
          summary: "GPU memory pressure is high"
          description: "GPU {{ $labels.gpu }} on node {{ $labels.kubernetes_node }} memory usage is above 90%"
      
      - alert: GPUXidError
        expr: DCGM_FI_DEV_XID_ERRORS > 0
        for: 1m
        labels:
          severity: critical
          component: gpu
        annotations:
          summary: "GPU XID errors detected"
          description: "GPU {{ $labels.gpu }} on node {{ $labels.kubernetes_node }} has XID errors indicating hardware or driver issues"
      
      - alert: GPUPowerThrottling
        expr: DCGM_FI_DEV_POWER_VIOLATION > 0
        for: 5m
        labels:
          severity: warning
          component: gpu
        annotations:
          summary: "GPU power throttling detected"
          description: "GPU {{ $labels.gpu }} on node {{ $labels.kubernetes_node }} is being throttled due to power constraints"
      
      - alert: NoGPUNodesAvailable
        expr: count(kube_node_labels{label_workload="gpu"}) == 0
        for: 2m
        labels:
          severity: critical
          component: cluster
        annotations:
          summary: "No GPU nodes available in cluster"
          description: "The cluster has no GPU nodes available, which may impact GPU workloads"
      
      - alert: LowGPUUtilization
        expr: avg(DCGM_FI_DEV_GPU_UTIL) < 20
        for: 30m
        labels:
          severity: info
          component: cost
        annotations:
          summary: "Low GPU utilization detected"
          description: "Average GPU utilization is {{ $value }}% over the last 30 minutes - consider scaling down for cost optimization"
      
      - alert: SpotNodeEviction
        expr: rate(kube_node_status_condition{condition="Ready",status="false",node=~".*gpuspot.*"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: spot
        annotations:
          summary: "Spot node may be getting evicted"
          description: "Spot node {{ $labels.node }} is showing instability which may indicate eviction"
