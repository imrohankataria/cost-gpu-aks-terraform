---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-test-pod
  labels:
    app: gpu-test
spec:
  # Toleration to allow scheduling on GPU nodes with taints
  tolerations:
    - key: "sku"
      operator: "Equal"
      value: "gpu"
      effect: "NoSchedule"
  # Node selector to ensure pod runs on GPU nodes
  nodeSelector:
    gpu-enabled: "true"
  containers:
    - name: cuda-test
      image: nvidia/cuda:11.8.0-base-ubuntu22.04
      command: ["bash", "-c"]
      args:
        - |
          echo "GPU Test Pod Started"
          nvidia-smi
          echo "Sleeping for 3600 seconds..."
          sleep 3600
      resources:
        limits:
          nvidia.com/gpu: 1  # Request 1 GPU
        requests:
          nvidia.com/gpu: 1
  restartPolicy: Never
